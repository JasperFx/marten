name: Documentation PRs

on:
  push:
    branches:
      - master
      - '9.0'
  pull_request:
    branches:
      - master
      - '9.0'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  node_version: 24.x
  NUKE_TELEMETRY_OPTOUT: true

jobs:
  run:
    name: "linting, spell check and build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: Check out the code

      - name: Lint Code Base
        uses: docker://ghcr.io/igorshubovych/markdownlint-cli:latest
        with:
          args: "--disable MD009 -- docs/**/*.md"

      - uses: actions/setup-node@v6
        name: Install Node.js
        with:
          node-version: ${{ env.node_version }}

      - run: npm install -g cspell
        name: Install cSpell

      - run: cspell --config ./docs/cSpell.json "docs/**/*.md"
        name: run cSpell

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build docs
        run: ./build.sh docs-build

      # The freight shipping tutorial sample is downloaded as a zip and built against the published Marten and
      # Wolverine packages named in its own Directory.Packages.props, so this catches a tutorial that no longer
      # compiles against them. After the docs build, so bin/ and obj/ are not there when the zip is made.
      - name: Build the freight shipping tutorial sample
        run: dotnet build docs/src/samples/FreightShipping/FreightShipping.csproj -c Release
